[project]
name = "process-kit-config"
version = "0.1.0"
description = "Config: read the config file, check it, and give every path in it resolved."
requires-python = ">=3.13"
dependencies = ["process-kit-types", "process-kit-schema"]

[dependency-groups]
dev = ["pytest>=8", "pyyaml>=6"]

[tool.uv.sources]
process-kit-types = { workspace = true }
process-kit-schema = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/process_kit/config"]
sources = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
