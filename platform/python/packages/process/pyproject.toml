[project]
name = "process-kit-process"
version = "0.1.0"
description = "Processes: read a process, check its whole graph, then run it one node at a time so a run can resume."
requires-python = ">=3.13"
dependencies = ["process-kit-types", "process-kit-schema", "process-kit-action"]

[dependency-groups]
dev = ["pytest>=8", "pyyaml>=6"]

[tool.uv.sources]
process-kit-types = { workspace = true }
process-kit-schema = { workspace = true }
process-kit-action = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/process_kit/process"]
sources = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
