  process: "name: x\ninput: {t: text, b: box}\nsteps:\n  - switch: b.kind\n    cases: {a: [a1], b: [a3]}\n    default: [{stop: other}]\n"
  expect: {"status": "stopped", "reason": "other", "done": [], "context": {"t": "hi", "b": {"kind": "c"}}, "events": [], "trace": []}
