# docs/tasks/_done/260921-process-cli-01/steps/m5-3-runner.md §3 — Runner.start(process, inputs, scopes, digest). The default main process is in world.yaml.
- id: S1
  inputs: {"t": "hi"}
  expect: {"status": "done", "reason": null, "done": ["a1", "a2"], "skipped": [], "context": {"t": "hi", "t1": "hi-1", "t2": "hi-1-2"}, "output": {"t2": "hi-1-2"}, "events": [["a1", "started"], ["a1", "done"], ["a2", "started"], ["a2", "done"]], "trace": ["a1", "a2"], "saves": [["running", []], ["running", ["a1"]], ["running", ["a1", "a2"]], ["done", ["a1", "a2"]]]}
