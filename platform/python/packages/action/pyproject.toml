[project]
name = "process-kit-action"
version = "0.1.0"
description = "Actions: read an action from its folder and run it, checking its inputs and outputs against their types."
requires-python = ">=3.13"
dependencies = ["process-kit-types", "process-kit-schema", "pyyaml>=6"]

[dependency-groups]
dev = ["pytest>=8", "pyyaml>=6"]

[tool.uv.sources]
process-kit-types = { workspace = true }
process-kit-schema = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/process_kit/action"]
sources = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
