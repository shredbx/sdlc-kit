# docs/tasks/_done/260921-process-cli-01/steps/m3-2-action-load.md §3 — Action.load(folder): every error, in order, by path and code. The first path step is the file, from the temporary folder.
- id: I1
  folder: x
  files: {"x/action.yaml": "", "x/action.sh": ""}
  expect: [{"path": ["x/action.yaml"], "code": "wrong_type"}]
- id: I2
  folder: x
  files: {"x/action.yaml": "- a\n", "x/action.sh": ""}
  expect: [{"path": ["x/action.yaml"], "code": "wrong_type"}]
- id: I3
  folder: x
  files: {"x/action.yaml": "name: [x", "x/action.sh": ""}
  expect: [{"path": ["x/action.yaml"], "code": "invalid"}]
- id: I4
  folder: x
  files: {"x/action.yaml": "name: x\nname: x\ntype: shell\n", "x/action.sh": ""}
  expect: [{"path": ["x/action.yaml"], "code": "invalid"}]
- id: I5
  folder: x
  files: {"x/action.yaml": "type: shell\n", "x/action.sh": ""}
  expect: [{"path": ["x/action.yaml", "name"], "code": "missing"}]
- id: I6
  folder: x
  files: {"x/action.yaml": "name: x\n", "x/action.sh": ""}
  expect: [{"path": ["x/action.yaml", "type"], "code": "missing"}]
- id: I7
  folder: x
  files: {"x/action.yaml": "name: x\ntype: python\n", "x/action.sh": ""}
  expect: [{"path": ["x/action.yaml", "type"], "code": "enum"}]
- id: I8
  folder: x
  files: {"x/action.yaml": "name: x\ntype: shell\ncheck: yes\n", "x/action.sh": ""}
  expect: [{"path": ["x/action.yaml", "check"], "code": "unexpected"}]
- id: I9
  folder: x
  files: {"x/action.yaml": "name: other\ntype: shell\n", "x/action.sh": ""}
  expect: [{"path": ["x/action.yaml", "name"], "code": "invalid"}]
- id: I10
  folder: Bad
  files: {"Bad/action.yaml": "name: Bad\ntype: shell\n", "Bad/action.sh": ""}
  expect: [{"path": ["Bad/action.yaml", "name"], "code": "pattern"}]
- id: I11
  folder: x
  files: {"x/action.yaml": "name: x\ntype: shell\ninput: [a]\n", "x/action.sh": ""}
