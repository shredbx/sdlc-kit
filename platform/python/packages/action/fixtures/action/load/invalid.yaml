  folder: x
  files: {"x/action.yaml": "name: x\ntype: shell\ninput:\n  a: 3\n", "x/action.sh": ""}
  expect: [{"path": ["x/action.yaml", "input", "a"], "code": "wrong_type"}]
- id: I14
  folder: x
  files: {"x/action.yaml": "name: x\ntype: shell\ninput:\n  a: Not A Type\n", "x/action.sh": ""}
