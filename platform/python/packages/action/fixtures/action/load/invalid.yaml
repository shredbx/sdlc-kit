- id: I15
  folder: x
  files: {"x/action.yaml": "name: x\ntype: shell\ninput:\n  1: string\n", "x/action.sh": ""}
  expect: [{"path": ["x/action.yaml", "input", 1], "code": "wrong_type"}]
- id: I16
  folder: x
  files: {"x/action.yaml": "name: x\ntype: shell\ndescription: 3\n", "x/action.sh": ""}
