# docs/tasks/_done/260921-process-cli-01/steps/m3-3-action-run.md §3 — what the scripts are given
- id: E1
  scripts: {action: '[ "$PROCESS_OUTPUT" -ef . ] && echo same > cwd.txt'}
  expect: {outcome: done, files: {out/cwd.txt: "same\n"}}
- id: E2
  assets: {hello.txt: hi}
  scripts: {action: 'cp "$ACTION_HOME/assets/hello.txt" hello.txt'}
  expect: {outcome: done, files: {out/hello.txt: hi}}
- id: E3
  input: {spec: mapping}
  output: {copy: mapping}
  scripts: {action: 'cat "$ACTION_INPUTS/spec.yaml" > "$ACTION_OUTPUTS/copy.yaml"'}
  inputs: {spec: {name: a, tags: [x, y]}}
  expect: {outcome: done, outputs: {copy: {name: a, tags: [x, y]}}}
- id: E4
  input: {build: mapping, count: integer}
  scripts:
    action: |
      printf '%s|%s|%s|%s|%s\n' "$INPUT_BUILD_TARGET" "$INPUT_BUILD_RUNTIME" "$INPUT_BUILD_FLAG" "$INPUT_BUILD_EMPTY" "${INPUT_BUILD_NESTED_A-unset}" > vars.txt
      printf '%s\n' "$INPUT_COUNT" >> vars.txt
  inputs: {build: {target: apps/hello-app, runtime: "3.13", flag: true, empty: null, nested: {a: 1}}, count: 3}
  expect: {outcome: done, files: {out/vars.txt: "apps/hello-app|3.13|true||unset\n3\n"}}
- id: E5
  input: {build-spec: mapping}
  scripts: {action: 'echo "$INPUT_BUILD_SPEC_MAIN_FILE" > hyphen.txt'}
  inputs: {build-spec: {main-file: a.py}}
  expect: {outcome: done, files: {out/hyphen.txt: "a.py\n"}}
- id: E6
  scripts: {action: 'echo "$GREETING" > greet.txt'}
  environment: {GREETING: hello}
  expect: {outcome: done, files: {out/greet.txt: "hello\n"}}
- id: E7
  scripts: {action: 'test -f "$ACTION_HOME/action.yaml" && echo own > own.txt'}
  environment: {ACTION_HOME: nowhere}
  expect: {outcome: done, files: {out/own.txt: "own\n"}}
