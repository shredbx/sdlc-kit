- id: S1
  input: {msg: string}
  output: {echoed: string}
  scripts: {action: 'echo "$INPUT_MSG" > "$ACTION_OUTPUTS/echoed.yaml"'}
  inputs: {msg: hi}
  expect: {outcome: done, outputs: {echoed: hi}}
- id: S2
  scripts: {action: "true"}
  expect: {outcome: done}
- id: S3
  scripts:
    check: echo check >> order.txt
    pre: echo pre >> order.txt
    action: echo action >> order.txt
    post: echo post >> order.txt
  expect: {outcome: done, files: {out/order.txt: "check\npre\naction\npost\n"}}
