  scripts: {action: 'echo boom >&2; exit 1'}
  expect: {outcome: failed, reason: "action.sh exited 1: boom"}
- id: S6
  output: {count: integer}
  scripts: {action: 'echo 1 > "$ACTION_OUTPUTS/count.yaml"', post: exit 1}
  expect: {outcome: failed, reason: post.sh exited 1}
