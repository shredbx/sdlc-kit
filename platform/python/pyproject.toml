[tool.uv.workspace]
members = ["packages/*", "frameworks/*"]

[dependency-groups]
dev = ["ruff>=0.6", "mypy>=1.11", "types-PyYAML"]

[tool.ruff]
target-version = "py313"
line-length = 160

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
explicit_package_bases = true
mypy_path = ["packages/types/src", "packages/schema/src", "packages/action/src", "packages/filesystem/src", "packages/config/src", "packages/template/src", "packages/process/src", "frameworks/process-framework/src"]
