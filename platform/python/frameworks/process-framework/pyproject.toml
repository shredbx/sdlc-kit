[project]
name = "process-framework"
version = "0.1.0"
description = "The framework: the config, the definitions and the runtime joined, entered through initialize."
requires-python = ">=3.13"
dependencies = ["process-kit-types", "process-kit-schema", "process-kit-config", "process-kit-action", "process-kit-filesystem", "process-kit-template", "process-kit-process", "pyyaml>=6"]

[dependency-groups]
dev = ["pytest>=8", "pyyaml>=6"]

[tool.uv.sources]
process-kit-types = { workspace = true }
process-kit-schema = { workspace = true }
process-kit-config = { workspace = true }
process-kit-action = { workspace = true }
process-kit-filesystem = { workspace = true }
process-kit-template = { workspace = true }
process-kit-process = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/process_framework"]
sources = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
