# docs/tasks/_done/260921-process-cli-01/steps/m3-4-catalog-opens.md §3 — Catalog.open(<tmp>/defs): every error, in order, by path and code. The first path step is the scope file, from <tmp>.
- id: I1
  files: {"defs/std/scope.yaml": ""}
  expect: [{"path": ["defs/std/scope.yaml"], "code": "wrong_type"}]
- id: I2
  files: {"defs/std/scope.yaml": "name: [std"}
  expect: [{"path": ["defs/std/scope.yaml"], "code": "invalid"}]
- id: I3
  files: {"defs/std/scope.yaml": "name: std\nname: std\nversion: 0.1.0\n"}
  expect: [{"path": ["defs/std/scope.yaml"], "code": "invalid"}]
- id: I4
  files: {"defs/std/scope.yaml": "version: 0.1.0\n"}
  expect: [{"path": ["defs/std/scope.yaml", "name"], "code": "missing"}]
- id: I5
  files: {"defs/std/scope.yaml": "name: std\n"}
  expect: [{"path": ["defs/std/scope.yaml", "version"], "code": "missing"}]
- id: I6
  files: {"defs/std/scope.yaml": "name: std\nversion: \"1.0\"\n"}
  expect: [{"path": ["defs/std/scope.yaml", "version"], "code": "pattern"}]
- id: I7
  files: {"defs/std/scope.yaml": "name: other\nversion: 0.1.0\n"}
  expect: [{"path": ["defs/std/scope.yaml", "name"], "code": "invalid"}]
- id: I8
  files: {"defs/Std/scope.yaml": "name: Std\nversion: 0.1.0\n"}
  expect: [{"path": ["defs/Std/scope.yaml", "name"], "code": "pattern"}]
- id: I9
  files: {"defs/std/scope.yaml": "name: std\nversion: 0.1.0\nowner: me\n"}
  expect: [{"path": ["defs/std/scope.yaml", "owner"], "code": "unexpected"}]
- id: I10
  files: {"defs/std/scope.yaml": "name: std\nversion: 0.1.0\nuses: std\n"}
  expect: [{"path": ["defs/std/scope.yaml", "uses"], "code": "wrong_type"}]
- id: I11
  files: {"defs/std/scope.yaml": "name: std\nversion: 0.1.0\nuses: [Bad]\n"}
  expect: [{"path": ["defs/std/scope.yaml", "uses", 0], "code": "pattern"}]
- id: I12
  files: {"defs/x/notes.txt": "no scope file\n"}
  expect: [{"path": ["defs/x/scope.yaml"], "code": "missing"}]
- id: I13
  files: {"defs/sdlc/scope.yaml": "name: sdlc\nversion: 0.1.0\nuses: [nope]\n"}
  expect: [{"path": ["defs/sdlc/scope.yaml", "uses", 0], "code": "unknown_scope"}]
- id: I14
  files: {"defs/a/scope.yaml": "name: a\nversion: 0.1.0\nuses: [b]\n", "defs/b/scope.yaml": "name: b\nversion: 0.1.0\nuses: [a]\n"}
  expect: [{"path": ["defs/a/scope.yaml", "uses"], "code": "cycle"}, {"path": ["defs/b/scope.yaml", "uses"], "code": "cycle"}]
- id: I15
  files: {"defs/a/scope.yaml": "name: a\nversion: 0.1.0\nuses: [a]\n"}
  expect: [{"path": ["defs/a/scope.yaml", "uses"], "code": "cycle"}]
- id: I16
  files: {"defs/a/scope.yaml": "name: a\n", "defs/b/scope.yaml": "version: 0.1.0\n"}
  expect: [{"path": ["defs/a/scope.yaml", "version"], "code": "missing"}, {"path": ["defs/b/scope.yaml", "name"], "code": "missing"}]
- id: I17
  files: {"defs/a/scope.yaml": "name: a\nversion: 0.1.0\nuses: [nope]\n", "defs/b/scope.yaml": "name: b\n"}
  expect: [{"path": ["defs/b/scope.yaml", "version"], "code": "missing"}]
- id: I18
  files: {"defs/a/scope.yaml": "name: a\nversion: 0.1.0\nuses: [b, nope]\n", "defs/b/scope.yaml": "name: b\nversion: 0.1.0\nuses: [a]\n"}
  expect: [{"path": ["defs/a/scope.yaml", "uses", 1], "code": "unknown_scope"}, {"path": ["defs/a/scope.yaml", "uses"], "code": "cycle"}, {"path": ["defs/b/scope.yaml", "uses"], "code": "cycle"}]
- id: N1
  files: {"defs/main/scope.yaml": "name: main\nversion: 0.1.0\n"}
  libraries: [{name: sdlc, path: nowhere}]
  expect: [{path: [processos.yaml, libraries, 0, path], code: not_found}]
- id: N2
  files: {"defs/main/scope.yaml": "name: main\nversion: 0.1.0\n", "lib1/scope.yaml": "name: sdlc\nversion: 0.1.0\n", "lib2/scope.yaml": "name: sdlc\nversion: 0.1.0\n"}
  libraries: [{name: sdlc, path: lib1}, {name: sdlc, path: lib2}]
  expect: [{path: [processos.yaml, libraries, 1, name], code: duplicate}]
- id: N3
  files: {"defs/sdlc/scope.yaml": "name: sdlc\nversion: 0.1.0\n", "lib/scope.yaml": "name: sdlc\nversion: 0.1.0\n"}
  libraries: [{name: sdlc, path: lib}]
  expect: [{path: [processos.yaml, libraries, 0, name], code: duplicate}]
- id: N4
  files: {"defs/main/scope.yaml": "name: main\nversion: 0.1.0\n", "lib/notes.txt": "hi\n"}
  libraries: [{name: sdlc, path: lib}]
  expect: [{path: [lib/scope.yaml], code: missing}]
- id: N5
  files: {"defs/main/scope.yaml": "name: main\nversion: 0.1.0\n", "lib/scope.yaml": "name: other\nversion: 0.1.0\n"}
  libraries: [{name: sdlc, path: lib}]
  expect: [{path: [lib/scope.yaml, name], code: invalid}]
- id: N6
  files: {"defs/main/scope.yaml": "name: main\nversion: 0.1.0\n", "lib/scope.yaml": "name: sdlc\nversion: 0.1.0\n"}
  libraries: [{name: sdlc, path: lib, version: 0.2.0}]
  expect: [{path: [processos.yaml, libraries, 0, version], code: version_mismatch}]
- id: N7
  files: {"defs/main/scope.yaml": "name: main\nversion: 0.1.0\n", "lib/scope.yaml": "name: sdlc\nversion: 0.1.0\nuses: [nope]\n"}
  libraries: [{name: sdlc, path: lib}]
  expect: [{path: [lib/scope.yaml, uses, 0], code: unknown_scope}]
