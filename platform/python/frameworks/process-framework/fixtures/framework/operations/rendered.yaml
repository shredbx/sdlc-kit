# docs/tasks/_done/260921-process-cli-01/steps/m4-3-framework-templates.md §3 — ProcessFramework.render('sdlc.pkg', 'data.yaml', into): the paths, and what is written. The definitions are anchored in R1 (`base`).
- id: R1
  base: &base
    "processos.yaml": "definitions: defs\nruntime:\n  root: .\n"
    "defs/std/scope.yaml": "name: std\nversion: 0.1.0\n"
    "defs/sdlc/scope.yaml": "name: sdlc\nversion: 0.1.0\nuses: [std]\n"
    "defs/sdlc/schema/spec.yaml": "name: spec\ntype: mapping\nfields:\n  name: {type: string, required: true}\n  other: {type: string}\n"
    "defs/sdlc/template/pkg/template.yaml": "name: pkg\ninput: spec\npattern:\n  \"{{name}}/main.py\": [\"def main(\"]\n"
    "defs/sdlc/template/pkg/files/README.md": "readme\n"
    "defs/sdlc/template/pkg/files/{{name}}/main.py.jinja": "def main():\n    return '{{ name }}'\n"
    "data.yaml": "name: app\n"
  files: {<<: *base}
  expect: {"paths": ["README.md", "app/main.py"], "files": {"output/README.md": null}}
- id: R2
  files: {<<: *base}
  into: "made"
  expect: {"paths": ["README.md", "app/main.py"], "files": {"output/made/README.md": "readme\n", "output/made/app/main.py": "def main():\n    return 'app'\n"}}
- id: R3
  files: {<<: *base}
  into: "a/b"
  expect: {"paths": ["README.md", "app/main.py"], "files": {"output/a/b/README.md": "readme\n", "output/a/b/app/main.py": "def main():\n    return 'app'\n"}}
- id: R4
  files: {<<: *base, "output/made/README.md": "old"}
  into: "made"
  expect: {"paths": ["README.md", "app/main.py"], "files": {"output/made/README.md": "readme\n"}}
