# docs/tasks/_done/260921-process-cli-01/steps/m5-5-framework-runs.md §3 — ProcessFramework.run(process, inputs): the Run, the events, and what gets saved. The definitions are anchored in P1 (`base`).
- id: P1
  base: &base
    "processos.yaml": "definitions: defs\nruntime:\n  root: .\n"
    "defs/sdlc/scope.yaml": "name: sdlc\nversion: 0.1.0\n"
    "defs/sdlc/type/message.yaml": "name: message\ntype: string\npattern: '[a-z]+'\n"
    "defs/sdlc/schema/style.yaml": "name: style\ntype: mapping\nfields:\n  mark: {type: string, required: true}\n"
    "defs/sdlc/action/greet/action.yaml": "name: greet\ntype: shell\ninput:\n  msg: message\noutput:\n  text: string\n"
    "defs/sdlc/action/greet/action.sh": "echo greet >> trace.txt\necho \"$INPUT_MSG\" > \"$ACTION_OUTPUTS/text.yaml\"\n"
    "defs/sdlc/action/shout/action.yaml": "name: shout\ntype: shell\ninput:\n  text: string\noutput:\n  loud: string\n"
    "defs/sdlc/action/shout/action.sh": "echo shout >> trace.txt\n[ -e fail.flag ] && exit 4\necho \"$INPUT_TEXT\" | tr a-z A-Z > \"$ACTION_OUTPUTS/loud.yaml\"\n"
    "defs/sdlc/action/mark/action.yaml": "name: mark\ntype: shell\ninput:\n  text: string\n  style: style\noutput:\n  marked: string\n"
    "defs/sdlc/action/mark/action.sh": "echo \"$INPUT_TEXT$INPUT_STYLE_MARK\" > \"$ACTION_OUTPUTS/marked.yaml\"\n"
    "defs/sdlc/process/hello.yaml": "name: hello\ninput: {msg: message}\noutput: {loud: string}\nsteps: [greet, shout]\n"
    "defs/sdlc/process/tell.yaml": "name: tell\ninput: {msg: message, note: message}\nrequires: {style: style}\noutput: {marked: string}\nsteps: [greet, mark]\n"
    "records/hi/msg.yaml": "hello\n"
    "records/hi/note.yaml": "note\n"
    "records/hi/extension/style.yaml": "mark: '!'\n"
  files: {<<: *base}
  target: "sdlc.hello"
  inputs: {"msg": "hi"}
  expect: {"run": {"status": "done", "done": ["sdlc.greet", "sdlc.shout"], "output": {"loud": "HELLO"}}, "events": [["sdlc.greet", "started"], ["sdlc.greet", "done"], ["sdlc.shout", "started"], ["sdlc.shout", "done"]], "saved": {"process": "sdlc.hello", "status": "done", "done": ["sdlc.greet", "sdlc.shout"], "skipped": [], "context": {"msg": "hello", "text": "hello", "loud": "HELLO"}, "output": {"loud": "HELLO"}}}
- id: P2
  files: {<<: *base}
  target: "sdlc.tell"
  inputs: {"msg": "hi", "note": "hi"}
  expect: {"run": {"status": "done", "done": ["sdlc.greet", "sdlc.mark"], "output": {"marked": "hello!"}}, "events": [["sdlc.greet", "started"], ["sdlc.greet", "done"], ["sdlc.mark", "started"], ["sdlc.mark", "done"]], "saved": {"status": "done", "context": {"msg": "hello", "note": "note", "style": {"mark": "!"}, "text": "hello", "marked": "hello!"}}}
- id: P3
  files: {<<: *base, "records/other/ext/style.yaml": "mark: '?'\n"}
  target: "sdlc.tell"
  inputs: {"msg": "hi", "note": "hi", "style": "other/ext"}
  expect: {"run": {"status": "done", "done": ["sdlc.greet", "sdlc.mark"], "output": {"marked": "hello?"}}, "events": [["sdlc.greet", "started"], ["sdlc.greet", "done"], ["sdlc.mark", "started"], ["sdlc.mark", "done"]], "saved": {"status": "done"}}
- id: P4
  files: {<<: *base, "defs/sdlc/action/shout/check.sh": "echo loud >&2\nexit 3\n"}
  target: "sdlc.hello"
  inputs: {"msg": "hi"}
  expect: {"run": {"status": "stopped", "reason": "loud", "done": ["sdlc.greet"]}, "events": [["sdlc.greet", "started"], ["sdlc.greet", "done"], ["sdlc.shout", "started"], ["sdlc.shout", "stopped"]], "saved": {"status": "stopped", "reason": "loud", "done": ["sdlc.greet"]}}
- id: P5
  files: {<<: *base, "defs/sdlc/action/greet/check.sh": "echo hi > \"$ACTION_OUTPUTS/text.yaml\"\nexit 77\n"}
  target: "sdlc.hello"
  inputs: {"msg": "hi"}
  expect: {"run": {"status": "done", "done": ["sdlc.greet", "sdlc.shout"], "skipped": ["sdlc.greet"], "output": {"loud": "HI"}}, "events": [["sdlc.greet", "started"], ["sdlc.greet", "skipped"], ["sdlc.shout", "started"], ["sdlc.shout", "done"]], "saved": {"status": "done", "skipped": ["sdlc.greet"]}}
- id: P6
  files: {<<: *base, "defs/sdlc/action/shout/action.sh": "exit 4\n"}
  target: "sdlc.hello"
  inputs: {"msg": "hi"}
  expect: {"run": {"status": "failed", "reason": "action.sh exited 4", "done": ["sdlc.greet"]}, "events": [["sdlc.greet", "started"], ["sdlc.greet", "done"], ["sdlc.shout", "started"], ["sdlc.shout", "failed"]], "saved": {"status": "failed", "reason": "action.sh exited 4"}}
