# docs/tasks/_done/260921-process-cli-01/steps/m5-5-framework-runs.md §3, revised by 260923-process-cli-05's
# M2 — Records.gather(input, requires, records, typed, types): the errors, by path and code. `given` and
# `values` are now one `records` mapping, resolved in order: a file at that exact path, then an id under
# this Records's own folder, then (for a scalar, only when the id resolves to nothing at all — a single
# `missing`) the text itself, cast as a literal. E3 (a scalar's id resolves to nothing) moved to
# gathered.yaml as H15 — it now succeeds, by design (§2). E13 (a mapping given a literal) now gives
# `missing`, not `wrong_type` — a real id was tried first and genuinely wasn't there, a better error
# than "this text isn't a mapping." E17 (a `requires` given directly) is no longer `unexpected` — `records`
# can supply a `requires` exactly as `given` always could; it is now the single `missing` its own id
# resolves to.
