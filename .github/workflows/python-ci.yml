name: python-ci

on:
  push:
    paths: ["platform/python/**", ".github/workflows/python-ci.yml"]
  pull_request:
    paths: ["platform/python/**", ".github/workflows/python-ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy packages/types/src packages/schema/src packages/action/src packages/filesystem/src packages/config/src packages/template/src packages/process/src frameworks/process-framework/src frameworks/agent-framework/src
      - run: uv run pytest packages/types
      - run: uv run pytest packages/schema
      - run: uv run pytest packages/action
      - run: uv run pytest packages/filesystem
      - run: uv run pytest packages/config
      - run: uv run pytest packages/template
      - run: uv run pytest packages/process
      - run: uv run pytest frameworks/process-framework
      - run: uv run pytest frameworks/agent-framework
