# A package, framework or product of this repository, described as a record: what it is, where it sits (its stack, kit and
# folder) and what it is built on. Forked from process-os.package and generalized from Python only: `module` becomes `kit`,
# `stack` and `path` are new, and `kind`'s value for a plain package is `package`. `dependencies` still holds Python
# requirement strings; Go and Svelte units bring their own manifests in later scopes (docs/proposals/unit-model-design.md).
# The record's own folder name is its id: the unit's installable name in lower-case hyphens (docs/proposals/unit-model-design.md,
# section 3, item 7).
name: package
type: mapping
fields:
  kind:         {type: package-kind}                      # left out, it is a package
  stack:        {type: stack, required: true}             # python, go or svelte: the language its code is written in
  kit:          {type: package-name}                      # the family a package belongs to: process-kit. A framework has none
  name:         {type: package-name, required: true}      # the unit's short name: the last segment of `path`
  path:         {type: unit-path, required: true}         # its folder from the repository root: platform/python/packages/types
  version:      {type: std.version, required: true}
  description:  {type: string, required: true}            # one sentence: what it is for
  uses:         {type: package-list, required: true}      # the ids of the units it is built on: process-kit-types
  dependencies: {type: requirement-list, required: true}  # anything else it needs installed
