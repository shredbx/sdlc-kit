# A dependency as its stack's manifest writes it, without spaces: pyyaml>=6, jinja2>=3,<4. Python's form for now;
# the Go and Svelte forms come with their own scopes (docs/proposals/unit-model-design.md). Forked from process-os.requirement.
name: requirement
type: string
pattern: '[A-Za-z0-9][A-Za-z0-9._-]*(\[[A-Za-z0-9._,-]+\])?((==|!=|<=|>=|~=|<|>)[A-Za-z0-9.*+!-]+(,(==|!=|<=|>=|~=|<|>)[A-Za-z0-9.*+!-]+)*)?'
