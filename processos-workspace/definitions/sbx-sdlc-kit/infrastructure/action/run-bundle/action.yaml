# Starts a service-bundle's docker-compose stack in the background (building the images of
# services that have a build), then verifies every host port the bundle publishes actually
# accepts a connection. Needs render-bundle to have already produced <bundle folder>/docker-compose.yml,
# and a real .env beside it.
name: run-bundle
type: shell
timeout: 300  # a first run pulls images (postgres, pgadmin) over the network and builds any that have a build; 60s default is too tight
input:
  bundle: service-bundle
