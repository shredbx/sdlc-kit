# `process-cli check`, validate this record against the `decision` schema, then refine the wording.
# Source: docs/plans/2026-09-25-process-os-port-completion-design.md
topic: mcp-transport
question: >-
  Does the ported process-os product expose MCP over stdio, over HTTP, or both?
status: decided
resolution: >-
  stdio only, for now. process-cli's `mcp` subcommand is a local stdio server, spawned as a subprocess by Claude
  Code through the plugin's plugin.json (mcpServers, command process-cli, args mcp). A network-reachable HTTP MCP
  server (for example behind FastAPI, for external chat or messenger adapters) is deferred until a real product
  needs network reach.
rationale: >-
  Every MCP exposure in process-os today is local stdio, nothing in this port needs network reach, and no
  requirement for HTTP has been discussed, so adding it now would be speculative. Operational caveat found in
  Milestone 9 (docs/plans/2026-09-25-definitions-library-milestone-9.md): a stdio server reads the workspace of the
  folder it was launched from and loads its catalog once at startup, so it goes stale when definitions change
  mid-session; until reconnected, use process-cli directly with an explicit --config.
date: '2026-09-25'
