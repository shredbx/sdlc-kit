[project]
name = "process-cli"
version = "0.1.0"
description = "The command line: finds the config, starts the framework, and prints."
requires-python = ">=3.13"
dependencies = ["process-framework", "mcp>=1.12"]

[project.scripts]
process-cli = "process_cli:main"

[dependency-groups]
dev = ["pytest>=8", "pyyaml>=6"]

[tool.uv.sources]
# sbx-sdlc-kit: upstream has `{ workspace = true }`. A member outside the uv workspace root (platform/python) cannot see
# that workspace from its own folder, so `workspace = true` fails; a path source works. See docs/plans/2026-09-25-process-os-apps-import-milestones-11-12.md.
process-framework = { path = "../../../../platform/python/frameworks/process-framework", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/process_cli"]
sources = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
