[project]
name = "process-cli"
version = "0.1.0"
description = "The command line: finds the config, starts the framework, and prints."
requires-python = ">=3.13"
dependencies = ["process-framework", "mcp>=1.12"]

[project.scripts]
process-cli = "process_cli:main"

[dependency-groups]
dev = ["pytest>=8", "pyyaml>=6"]

[tool.uv.sources]
# sbx-sdlc-kit: matches upstream (`{ workspace = true }`). uv <0.12 couldn't resolve a workspace member reached
# only via a glob outside the workspace root, so this used a `path` source as a workaround; uv >=0.12 fixed that
# resolution and now requires `workspace = true` for any actual workspace member. See docs/plans/2026-09-26-uv-workspace-source-ci-fix.md.
process-framework = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/process_cli"]
sources = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
