# docs/tasks/_done/260921-process-cli-01/steps/m3-8-cli-commands.md §3 — process-cli run: the errors that keep it from starting. The
# definitions are anchored in U1 (`base`). U2 (msg's own records/hi/msg.yaml missing) moved to printed.yaml as X8,
# 260923-process-cli-05's M2 — msg is a scalar, so a missing id now falls back to a literal instead of erroring.
- id: U1
  base: &base
    "processos.yaml": "definitions: defs\nruntime:\n  root: .\n"
    "defs/std/scope.yaml": "name: std\nversion: 0.1.0\n"
    "defs/std/type/x.yaml": "name: x\ntype: string\n"
    "defs/std/schema/y.yaml": "name: y\ntype: mapping\n"
    "defs/std/action/z/action.yaml": "name: z\ntype: shell\n"
    "defs/std/action/z/action.sh": "true\n"
    "defs/sdlc/scope.yaml": "name: sdlc\nversion: 0.1.0\nuses: [std]\n"
    "defs/sdlc/type/message.yaml": "name: message\ntype: string\npattern: '[a-z]+'\n"
    "defs/sdlc/schema/greeting.yaml": "name: greeting\ntype: mapping\nfields:\n  text: {type: message, required: true}\n"
    "defs/sdlc/action/greet/action.yaml": "name: greet\ntype: shell\ninput:\n  msg: message\noutput:\n  text: string\n"
    "defs/sdlc/action/greet/action.sh": "echo \"$INPUT_MSG\" > \"$ACTION_OUTPUTS/text.yaml\"\n"
    "records/hi/msg.yaml": "hello\n"
  files: {<<: *base}
  args: ["run", "sdlc.nope"]
  expect: {"starts": ["unknown_id: "]}
- id: U3
  files: {<<: *base, "defs/sdlc/action/greet/action.yaml": "{{{"}
  args: ["run", "sdlc.greet", "--records", "msg=hi"]
  expect: {"starts": ["defs/sdlc/action/greet/action.yaml: invalid: "]}
- id: U4
  files: {<<: *base}
  args: ["run", "sdlc.greet", "--records", "msg=../x"]
  expect: {"starts": ["msg: outside_root: "]}
- id: U5
  files: {<<: *base, "records/hi/msg.yaml": "NOT-lower\n"}
  args: ["run", "sdlc.greet", "--records", "msg=hi"]
  expect: {"starts": ["records/hi/msg.yaml: pattern: "]}
- id: U6
  files: {<<: *base}
  args: ["run", "sdlc.greet", "--records", "msg=NOT-lower"]
  expect: {"starts": ["msg: pattern: "]}
