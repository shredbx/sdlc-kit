<!doctype html>
<html lang="%wanflo.lang%">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" type="image/png" />
    <link
      rel="apple-touch-icon"
      href="%sveltekit.assets%/apple-touch-icon.png"
    />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Value substituted per request in hooks.server.ts, from site.yml. Static here so
		     the browser chrome is already the right colour on the very first paint; the
		     script below corrects it when the visitor's stored choice is dark. -->
    <meta name="theme-color" content="%wanflo.themeLight%" />
    <!-- Latin is preloaded on every page: the nav, the brand words and the stack chips are
		     Latin in all three locales. The second preload is the locale's OWN script,
		     substituted in hooks.server.ts — without it a Thai or Russian visitor discovers
		     their font only after the CSS has parsed and rendered a fallback first. -->
    <link
      rel="preload"
      href="%sveltekit.assets%/fonts/nunito-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
    %wanflo.fontPreload%
    <!-- Substituted in hooks.server.ts. Empty unless site.yml names a media CDN. -->
    %wanflo.mediaPreconnect%
    <script>
      // Theme first-paint (no FOUC). Light is the default; dark ONLY when the visitor
      // explicitly chose it via the nav switcher — the site never auto-follows the OS.
      // Runs synchronously before <body> so the first paint is already correct.
      (() => {
        try {
          const theme = localStorage.getItem("wanflo-theme");
          document.documentElement.setAttribute(
            "data-theme",
            theme === "light" || theme === "dark" ? theme : "dark",
          );
        } catch {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>

    <!-- Google Analytics (GA4) — Consent Mode v2, deny-by-default. MUST run synchronously
		     before gtag.js loads (loaded later by Analytics.svelte via initAnalytics()).
		     CRITICAL: gtag() pushes the `arguments` object, NOT an array. dataLayer.push([...])
		     is silently dropped by gtag.js — the "script 200 + full dataLayer + ZERO /g/collect"
		     non-tracking bug BR shipped before it was fixed. Do not rewrite as array pushes. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("consent", "default", {
        analytics_storage: "denied",
        ad_storage: "denied",
        ad_user_data: "denied",
        ad_personalization: "denied",
      });
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
