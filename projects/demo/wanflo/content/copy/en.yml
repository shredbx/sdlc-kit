website.crosslink: "Need an app as well?"
website.crosslink.cta: "See mobile apps"

website.faq.title: "Questions"
website.faq.q1.q: "How long does a website take?"
website.faq.q1.a: "A one-page site is usually two to three weeks from the first conversation to being live. A catalogue or booking site is typically six to ten weeks, depending on how much of your content is ready. A property platform with an admin back-office runs longer — we scope that one properly before quoting, because guessing helps nobody."
website.faq.q2.q: "Do I own the code and the data?"
website.faq.q2.a: "Yes, both. The code goes in a repository you own, the site runs on hosting in your name, and the database is yours. There is no licence to keep paying us and no lock-in — if you want to move the whole thing elsewhere, you can, and we will help you do it."
website.faq.q3.q: "Can you take over a site someone else built?"
website.faq.q3.a: "Often, yes. We look at what is there first and tell you honestly whether it is worth continuing or worth replacing — sometimes the existing site is fine and only needs maintenance. That review is a normal part of the conversation, not a paid engagement."
website.faq.q4.q: "Do you do SEO?"
website.faq.q4.a: "The technical side is built in: clean markup, structured data, fast pages, correct multilingual setup, a real sitemap. Ongoing content and link work is a separate, ongoing job — we can do it, but it is honest to call it what it is rather than to bundle it into a build price."
website.faq.q5.q: "What does it cost to keep running?"
website.faq.q5.a: "Hosting and domain for a normal site are small — usually a few hundred baht a month, paid directly by you to the provider, not marked up by us. Beyond that you only pay for changes you actually ask for, or a fixed care plan if you would rather not think about it."

# ── /mobile ──────────────────────────────────────────────────────────────────
mobile.meta.title: "Mobile app development in Thailand — {name}"
mobile.meta.description: "iOS, Android and cross-platform apps, built and released to both stores, and maintained after launch. Shipped apps, named stack. Thailand-based."
mobile.hero.title: "Apps built, released and looked after."
mobile.hero.lead: "iOS, Android and cross-platform. We build it, get it through review into both stores, and keep it working after launch."
mobile.work.title: "Selected mobile apps"
mobile.work.lead: "A sample of iOS and Android apps built — both native and cross-platform."
mobile.packages.title: "Packages"
mobile.packages.lead: "Three shapes. Anything that does not fit goes in Custom."
mobile.crosslink: "Need a website as well?"
mobile.crosslink.cta: "See websites"

mobile.faq.title: "Questions"
mobile.faq.q1.q: "Native or cross-platform?"
mobile.faq.q1.a: "Cross-platform unless there is a reason not to — one codebase in both stores is cheaper to build and much cheaper to keep alive. We go native when the app leans hard on the device: heavy maps, background location, tight hardware integration. We will tell you which one your app is before you commit."
mobile.faq.q2.q: "How long until it is in the stores?"
mobile.faq.q2.a: "A starter app is roughly four to six weeks including store review. A business app tied to a back-office is usually two to four months. Apple's review itself is normally a day or two now, but the first submission of a new app takes longer, so we plan for it rather than promising around it."
mobile.faq.q3.q: "Do you handle the App Store and Play accounts?"
mobile.faq.q3.a: "We set up and submit, and we deal with the review process, including rejections. The developer accounts should be registered in your company's name and paid for by you — that way the apps are legally yours, and you are never locked to us to publish an update."
mobile.faq.q4.q: "Can you take over an existing app?"
mobile.faq.q4.a: "Usually. We start by reading the code and telling you what state it is really in, which is sometimes better and sometimes worse than expected. If it is worth continuing we continue it; if rebuilding is genuinely cheaper than fixing, we will say so even though it is the more expensive answer for you to hear."
mobile.faq.q5.q: "What happens after launch?"
mobile.faq.q5.a: "Apps need maintenance whether or not they change: the platforms release a new OS every year, and store requirements move. We offer a maintenance plan that covers keeping it building, submitted and compatible. New features are quoted separately as you ask for them."

