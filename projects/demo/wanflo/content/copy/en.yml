# ── /website ─────────────────────────────────────────────────────────────────
website.meta.title: "Website development in Thailand — {name}"
website.meta.description: "We build landing pages, catalogues, booking sites and real-estate platforms. Live projects, named stack, fixed packages. Thailand-based."
website.hero.title: "Websites that do a job."
website.hero.lead: "Landing pages, catalogues, booking, property platforms. Built on your own domain and your own data — fast, multilingual, and yours to keep."
website.work.title: "Selected websites"
website.work.lead: "A sample of recent website work, from full platforms to small business sites."
website.packages.title: "Packages"
