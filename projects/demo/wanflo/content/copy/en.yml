# Wanflo — English copy. ★ THIS FILE IS THE MASTER KEYSET. ★
#
# Every visible word on the site is here. Edit a value, run `pnpm build`, it changes.
# th.yml and ru.yml must carry EXACTLY these keys — no more, no fewer. The build fails
# and names the offending key otherwise, so a half-translated locale can never ship.
#
# Add a key here FIRST, then to th.yml and ru.yml. Remove it here LAST.
#
# Project DESCRIPTIONS are here too, under `work.<slug>.note`, not in work.yml — they are
# prose, and prose is per-language. Being here means the keyset check guarantees a project
# can never have an English description and be silently missing its Thai one.

