mobile.work.lead: "Примеры приложений для iOS и Android — нативных и кроссплатформенных."
mobile.packages.title: "Пакеты"
mobile.packages.lead: "Три формата. Всё, что в них не укладывается, идёт в индивидуальную разработку."
mobile.crosslink: "Нужен ещё и сайт?"
mobile.crosslink.cta: "Смотреть сайты"

mobile.faq.title: "Вопросы"
mobile.faq.q1.q: "Нативное приложение или кроссплатформенное?"
mobile.faq.q1.a: "По умолчанию кроссплатформенное, если нет причин поступить иначе: одна кодовая база на оба стора дешевле в разработке и заметно дешевле в поддержке. Нативную разработку выбираем, когда приложение сильно опирается на устройство: тяжёлые карты, фоновая геолокация, плотная работа с оборудованием. Мы скажем, какой случай ваш, до того как вы примете решение."
mobile.faq.q2.q: "Сколько времени до публикации в сторах?"
mobile.faq.q2.a: "Стартовое приложение — примерно четыре-шесть недель вместе с модерацией. Бизнес-приложение, связанное с внутренней системой, обычно от двух до четырёх месяцев. Сама проверка Apple сейчас чаще всего занимает день-два, но первая публикация нового приложения идёт дольше, поэтому мы закладываем это в сроки, а не обещаем то, что от нас не зависит."
mobile.faq.q3.q: "Берёте ли вы на себя аккаунты App Store и Google Play?"
mobile.faq.q3.a: "Мы настраиваем аккаунты, публикуем приложение и ведём процесс модерации, включая отказы. При этом аккаунты разработчика должны быть оформлены на вашу компанию и оплачены вами — так приложения юридически принадлежат вам, и вы не привязаны к нам ради выпуска обновления."
mobile.faq.q4.q: "Возьмётесь ли вы за существующее приложение?"
mobile.faq.q4.a: "Как правило, да. Начинаем с чтения кода и честно говорим, в каком он состоянии — иногда лучше, чем ожидалось, иногда хуже. Если продолжать имеет смысл, продолжаем. Если переписать действительно дешевле, чем чинить, мы скажем и это, хотя такой ответ обходится вам дороже."
mobile.faq.q5.q: "Что происходит после запуска?"
mobile.faq.q5.a: "Приложение требует поддержки, даже если само не меняется: платформы каждый год выпускают новую ОС, а требования сторов меняются. У нас есть тариф поддержки, который покрывает сборку, публикацию обновлений и совместимость с новыми версиями. Новые функции оцениваются отдельно, по мере ваших запросов."

