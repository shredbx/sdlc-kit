website.faq.title: "Вопросы"
website.faq.q1.q: "Сколько времени занимает разработка сайта?"
website.faq.q1.a: "Одностраничный сайт обычно занимает две-три недели от первого разговора до запуска. Каталог или сайт бронирования — как правило, от шести до десяти недель, в зависимости от готовности вашего контента. Платформа недвижимости с админской частью занимает больше времени: мы сначала подробно оцениваем объём работ и только потом называем цену, потому что гадать не в интересах ни одной из сторон."
website.faq.q2.q: "Код и данные принадлежат мне?"
website.faq.q2.a: "Да, и то и другое. Код хранится в репозитории, который принадлежит вам, сайт работает на хостинге, оформленном на вас, база данных — ваша. Нет лицензии, за которую нужно платить нам, и нет привязки к подрядчику: если захотите перенести проект в другое место, вы это сможете, и мы поможем."
website.faq.q3.q: "Возьмётесь ли вы за сайт, который делал кто-то другой?"
website.faq.q3.a: "Чаще всего да. Сначала мы смотрим, что уже сделано, и честно говорим, что выгоднее — продолжать или переделывать. Иногда существующий сайт в порядке и ему нужна только поддержка. Такой аудит — обычная часть разговора, а не отдельная платная услуга."
website.faq.q4.q: "Занимаетесь ли вы SEO?"
website.faq.q4.a: "Техническая часть заложена сразу: чистая разметка, структурированные данные, быстрые страницы, корректная многоязычность, рабочая карта сайта. Постоянная работа с контентом и ссылками — отдельная долгосрочная задача. Мы можем ею заниматься, но честнее называть её своим именем, а не включать в стоимость разработки."
website.faq.q5.q: "Сколько стоит поддержка?"
website.faq.q5.a: "Хостинг и домен для обычного сайта стоят немного — как правило, несколько сотен бат в месяц, и вы платите их напрямую провайдеру, без наценки с нашей стороны. Дальше вы платите только за те доработки, которые действительно заказываете, либо выбираете фиксированный тариф поддержки, если не хотите об этом думать."

