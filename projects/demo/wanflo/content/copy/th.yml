website.faq.title: "คำถามที่พบบ่อย"
website.faq.q1.q: "ทำเว็บไซต์ใช้เวลานานเท่าไร"
website.faq.q1.a: "เว็บไซต์หน้าเดียวโดยทั่วไปใช้เวลาสองถึงสามสัปดาห์ นับจากการพูดคุยครั้งแรกจนเปิดใช้งานจริง เว็บแคตตาล็อกหรือเว็บระบบจองมักใช้เวลาหกถึงสิบสัปดาห์ ขึ้นอยู่กับความพร้อมของเนื้อหาที่คุณมี ส่วนแพลตฟอร์มอสังหาริมทรัพย์ที่มีระบบหลังบ้านจะใช้เวลานานกว่านั้น เราจะประเมินขอบเขตงานให้ละเอียดก่อนเสนอราคา เพราะการเดาไม่เป็นผลดีกับใครทั้งนั้น"
website.faq.q2.q: "โค้ดและข้อมูลเป็นของเราหรือไม่"
website.faq.q2.a: "เป็นของคุณทั้งสองอย่าง โค้ดอยู่ในรีโพซิทอรีที่คุณเป็นเจ้าของ เว็บไซต์รันบนโฮสติงในชื่อของคุณ และฐานข้อมูลเป็นของคุณ ไม่มีค่าไลเซนส์รายเดือนที่ต้องจ่ายให้เรา และไม่มีการผูกมัด หากคุณต้องการย้ายทั้งระบบไปที่อื่น คุณทำได้ และเราจะช่วยคุณย้าย"
website.faq.q3.q: "รับดูแลเว็บไซต์ที่คนอื่นทำไว้หรือไม่"
website.faq.q3.a: "ส่วนใหญ่รับ เราจะดูของเดิมก่อนแล้วบอกตรง ๆ ว่าควรทำต่อหรือควรทำใหม่ บางครั้งเว็บเดิมก็ใช้ได้ดีอยู่แล้วและต้องการแค่การดูแลรักษา การตรวจสอบนี้เป็นส่วนหนึ่งของการพูดคุยตามปกติ ไม่มีค่าใช้จ่าย"
website.faq.q4.q: "ทำ SEO ด้วยหรือไม่"
website.faq.q4.a: "ด้าน SEO เชิงเทคนิคเราทำให้ตั้งแต่ต้น ทั้งโครงสร้างมาร์กอัปที่สะอาด structured data หน้าเว็บที่โหลดเร็ว การตั้งค่าหลายภาษาที่ถูกต้อง และ sitemap ที่ใช้งานได้จริง ส่วนการทำคอนเทนต์และลิงก์อย่างต่อเนื่องเป็นงานคนละส่วนที่ต้องทำระยะยาว เรารับทำได้ แต่ควรเรียกตามจริงมากกว่าเหมารวมไว้ในราคาพัฒนาเว็บ"
website.faq.q5.q: "ค่าดูแลรายเดือนประมาณเท่าไร"
website.faq.q5.a: "ค่าโฮสติงและโดเมนสำหรับเว็บไซต์ทั่วไปไม่สูง โดยปกติหลักร้อยบาทต่อเดือน จ่ายตรงกับผู้ให้บริการ เราไม่บวกเพิ่ม นอกเหนือจากนั้นคุณจ่ายเฉพาะงานแก้ไขที่คุณสั่งจริง หรือเลือกแพ็กเกจดูแลรายเดือนแบบราคาคงที่หากไม่อยากคิดเรื่องนี้เอง"

