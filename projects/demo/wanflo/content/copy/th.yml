mobile.faq.title: "คำถามที่พบบ่อย"
mobile.faq.q1.q: "ควรทำแบบเนทีฟหรือข้ามแพลตฟอร์ม"
mobile.faq.q1.a: "เราแนะนำข้ามแพลตฟอร์มเป็นหลัก เว้นแต่มีเหตุผลเฉพาะ เพราะโค้ดชุดเดียวลงได้ทั้งสองสโตร์ ต้นทุนพัฒนาถูกกว่าและต้นทุนดูแลระยะยาวถูกกว่ามาก เราเลือกเนทีฟเมื่อแอปพึ่งพาความสามารถของเครื่องสูง เช่น แผนที่ที่ใช้งานหนัก การติดตามตำแหน่งเบื้องหลัง หรือการเชื่อมต่อฮาร์ดแวร์โดยตรง เราจะบอกคุณก่อนตัดสินใจว่าแอปของคุณควรเป็นแบบไหน"
mobile.faq.q2.q: "ใช้เวลานานเท่าไรกว่าจะขึ้นสโตร์"
mobile.faq.q2.a: "แอปเริ่มต้นใช้เวลาประมาณสี่ถึงหกสัปดาห์ รวมเวลาตรวจสอบของสโตร์แล้ว แอปธุรกิจที่เชื่อมกับระบบหลังบ้านมักใช้เวลาสองถึงสี่เดือน ปัจจุบันการตรวจสอบของ Apple มักใช้เวลาหนึ่งถึงสองวัน แต่การส่งครั้งแรกของแอปใหม่จะใช้เวลานานกว่า เราจึงเผื่อเวลาไว้ในแผนแทนที่จะรับปากเกินจริง"
mobile.faq.q3.q: "ดูแลบัญชี App Store และ Google Play ให้หรือไม่"
mobile.faq.q3.a: "เราตั้งค่าและส่งแอปให้ รวมถึงจัดการขั้นตอนตรวจสอบและกรณีที่ถูกปฏิเสธ ทั้งนี้บัญชีนักพัฒนาควรจดทะเบียนในนามบริษัทของคุณและชำระเงินโดยคุณเอง เพื่อให้แอปเป็นของคุณตามกฎหมาย และคุณไม่ถูกผูกไว้กับเราในการอัปเดตแต่ละครั้ง"
mobile.faq.q4.q: "รับพัฒนาแอปที่มีอยู่แล้วต่อหรือไม่"
mobile.faq.q4.a: "โดยทั่วไปรับ เราเริ่มจากการอ่านโค้ดและบอกคุณตามจริงว่าสถานะปัจจุบันเป็นอย่างไร ซึ่งบางครั้งดีกว่าที่คาดและบางครั้งแย่กว่า ถ้าควรทำต่อเราก็ทำต่อ แต่ถ้าการเขียนใหม่ถูกกว่าการไล่แก้จริง ๆ เราจะบอกตรง ๆ แม้เป็นคำตอบที่คุณต้องจ่ายแพงกว่าก็ตาม"
mobile.faq.q5.q: "หลังเปิดตัวแล้วต้องทำอะไรต่อ"
mobile.faq.q5.a: "แอปต้องมีการดูแลเสมอ แม้ตัวแอปจะไม่เปลี่ยนก็ตาม เพราะแต่ละแพลตฟอร์มออกระบบปฏิบัติการใหม่ทุกปีและข้อกำหนดของสโตร์เปลี่ยนอยู่เรื่อย ๆ เรามีแพ็กเกจดูแลที่ครอบคลุมการคอมไพล์ การส่งอัปเดต และการรองรับเวอร์ชันใหม่ ส่วนฟีเจอร์ใหม่คิดราคาแยกตามที่คุณสั่งเพิ่ม"

