# ── MOBILE ───────────────────────────────────────────────────────────────────
# EVERY app carries TWO shots (owner directive 2026-08-24): the first is the one that still
# reads at 92px on the home tile, the second is the proof that the app actually works.
#
# ORDER IS DISPLAY ORDER (owner-set 2026-08-24). Nothing in code sorts these — the first
# three fill the first row on /mobile, and the first four are what the home page shows.
#
# Every `url:` below was verified live (HTTP 200) before it was added. Most are PRODUCT
# SITES rather than store listings — Intuition is the only one with a store link, and that
# store is RuStore, not Google Play. App Store / Play links are still outstanding (see
# docs/plans/2026-08-24-wanflo-asset-requests.md, B2). Adding a url to any other entry turns
# its link on with no code change.

