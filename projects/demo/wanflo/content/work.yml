# Wanflo — shipped work. EDIT HERE, nowhere else.
#
# Transcribed from the owner's portfolio (Mini_Portfolio_B.pdf) — names, types, stacks and
# URLs are exactly as written there. Nothing is invented.
#
# WHERE THE WORDS ARE: not here. The description AND the type line live in
# content/copy/<lang>.yml under `work.<slug>.note` and `work.<slug>.type`, because they are
# prose and prose is per-language. Putting them there means the master-keyset check
# guarantees a project can never have an English description and be silently missing its
# Thai one — which is exactly what `type:` did while it sat in this file.
#
# shots:      screenshots, IN DISPLAY ORDER. The first one is used wherever only one fits
#             (the home page). `width` is the file's REAL width, recorded so the card never
#             UPSCALES a 320px original from 2013 into softness.
#             All 17 are WebP. The 12 mobile shots are the owner's own files copied
#             byte-for-byte — verified identical by md5, never re-encoded. The 5 website
#             captures are the only ones cwebp touches, because 2560px browser shots have
#             to be resized and Bestie has to have its browser chrome cropped off.
#             None → a neutral placeholder block, never a broken image.
# url:        absent → the card renders complete with NO link (not a dead anchor). Only the
#             HOST is shown on screen (www. stripped), so a long store path stays readable
#             and every card's link reads the same length.
# credit:     who it was built FOR (role: client) or THROUGH (role: studio). A portfolio
#             entry claims "we built this"; the credit says for whom — which is the part a
#             reader can independently verify. { label, role, url? }; url optional.
# archived:   the project is retired. DELIBERATELY separate from `url`: most apps below have
#             no public store link, which is not the same as being archived.
# featured:   also appears in the "selected work" row on the home page.
#
# The shipped-project counts on the home page are COUNTED from this file. Add an entry and
# the badge follows. Nobody edits a number in a component.

# ── WEB ──────────────────────────────────────────────────────────────────────
